name: Bug report
description: Report a reproducible HanKey problem without sensitive input content
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, private text, raw key logs, or full-screen captures. Use synthetic examples only."
  - type: input
    id: version
    attributes:
      label: HanKey version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Input surface
      options:
        - Native text field
        - Browser page field
        - Browser address field
        - Electron editor
        - Protected or unsupported surface
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic text
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Content-free diagnostic information
