name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - macos-26-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Validate
        run: ./scripts/check.sh

  release-smoke:
    name: Universal release smoke
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build universal app
        run: ./packaging/build-universal-app.sh
        env:
          HANKEY_CODESIGN_IDENTITY: '-'

      - name: Package release artifacts
        run: ./packaging/package-release.sh
        env:
          HANKEY_CODESIGN_IDENTITY: '-'

      - name: Verify release artifacts
        run: ./packaging/verify-release.sh
